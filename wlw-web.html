
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Desktop — Finder</title>

<style>
:root {
  --blue: #39aee9;
  --text: #202124;
  --muted: #8b8b8b;
  --line: #e6e6e6;
}

* {
  box-sizing: border-box;
}

html, body {
  min-height: 100%;
  /* Cegah pinch-zoom, tetapi scrolling biasa tetap bisa. */
  touch-action: pan-x pan-y;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 28px;
  color: var(--text);
  background: radial-gradient(
    ellipse at center,
    #fff 0%,
    #f6f6f6 58%,
    #ededed 100%
  );
  font-family: -apple-system, BlinkMacSystemFont,
               "SF Pro Display", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, a {
  font: inherit;
}

.finder {
  width: min(900px, 100%);
  height: min(690px, calc(100vh - 56px));
  min-height: 470px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(0,0,0,.22);
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 18px 42px rgba(0,0,0,.17);
}

/* TOOLBAR */
.toolbar {
  height: 52px;
  flex: 0 0 52px;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(#fbfbfb, #f7f7f7);
}

.traffic {
  display: flex;
  gap: 4px;
  margin-right: 12px;
}

.traffic span {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.traffic span:nth-child(1) { background: #ff6058; }
.traffic span:nth-child(2) { background: #ffbd2e; }
.traffic span:nth-child(3) { background: #28c840; }

.nav-buttons {
  display: flex;
  gap: 13px;
  color: #777;
}

.nav-buttons button,
.tool-icons button {
  border: 0;
  padding: 3px;
  background: transparent;
  color: inherit;
  cursor: pointer;
  display: grid;
  place-items: center;
}

.nav-buttons button:disabled {
  opacity: .35;
  cursor: default;
}

.chevron {
  font-size: 24px;
  line-height: 18px;
  font-weight: 300;
}

.location-title {
  font-size: 13px;
  font-weight: 600;
}

.toolbar-spacer {
  flex: 1;
}

.tool-icons {
  display: flex;
  align-items: center;
  gap: 15px;
  color: #777;
}

.tool-icons svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.5;
}

.more-icon {
  margin-left: 8px;
  margin-right: -4px;
}

.search-icon {
  margin-left: 14px;
}

/* BODY */
.body {
  flex: 1;
  min-height: 0;
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 215px;
  flex: 0 0 215px;
  padding: 34px 10px 15px;
  background: #e9e9e9;
  border-right: 1px solid #d9d9d9;
  color: #555;
  font-size: 12px;
}

.side-heading {
  margin: 0 0 8px 10px;
  color: #999;
  font-size: 10px;
}

.side-group {
  margin-bottom: 22px;
}

.side-item {
  height: 26px;
  padding: 0 9px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: 5px;
  color: #444;
}


.sidebar-link {
  width: 100%;
  border: 0;
  background: transparent;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.sidebar-link:focus-visible {
  outline: 2px solid #168bd2;
  outline-offset: -2px;
}
.side-item.active {
  background: #d6d6d6;
}

.side-icon {
  width: 14px;
  text-align: center;
  color: #777;
}

/* MAIN */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: #fff;
}

.content {
  flex: 1;
  min-height: 0;
  padding: 32px 24px 20px;
  overflow: auto;
}

.folders {
  display: grid;
  grid-template-columns: repeat(4, minmax(90px, 1fr));
  gap: 16px;
  align-items: start;
  max-width: 660px;
}

.folder {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 13px;
  padding: 0 4px 10px;
  border: 0;
  background: transparent;
  color: #171717;
  cursor: pointer;
  border-radius: 10px;
  text-decoration: none;
  transition: transform .18s ease;
}

.folder:hover {
  transform: translateY(-3px);
}

.folder:active {
  transform: scale(.97);
}

.folder-art {
  width: min(100%, 126px);
  aspect-ratio: 1.12 / 1;
}

.folder-name {
  font-size: 13px;
  line-height: 1.25;
  text-align: center;
  overflow-wrap: anywhere;
}

/* STATUSBAR */
.statusbar {
  height: 44px;
  flex: 0 0 44px;
  border-top: 1px solid #ededed;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  color: #858585;
  font-size: 11px;
}

.crumb {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.crumb strong {
  font-weight: 500;
  color: #777;
}

.status-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.slider {
  width: 62px;
  height: 3px;
  background: #d6d6d6;
  border-radius: 5px;
  position: relative;
}

.slider::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  border: 1px solid #aaa;
  border-radius: 50%;
  background: #f8f8f8;
  top: 50%;
  left: 45%;
  transform: translate(-50%, -50%);
}

/* ISI FOLDER */
.folder-view {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 13px;
  padding: 24px;
  animation: appear .24s ease both;
}

.folder-view h1 {
  margin: 0;
  font-size: clamp(25px, 4vw, 36px);
  font-weight: 600;
  letter-spacing: -.035em;
}

.folder-view p {
  margin: 0;
  color: #777;
  font-size: 14px;
  line-height: 1.65;
}

.folder-view a {
  color: #168bd2;
  text-decoration: none;
  font-size: 17px;
}

.folder-view a:hover {
  text-decoration: underline;
}

.korean {
  font-size: clamp(18px, 3vw, 24px) !important;
  color: #555 !important;
}

.copyright-note {
  color: #999 !important;
  font-size: 11px !important;
  white-space: nowrap;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(7px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MOBILE */
@media (max-width: 650px) {
  body {
    padding: 12px;
  }

  .finder {
    height: calc(100vh - 24px);
    min-height: 440px;
    border-radius: 12px;
  }

  .toolbar {
    gap: 10px;
    padding: 0 12px;
    height: 48px;
    flex-basis: 48px;
  }

  .traffic {
    margin-right: 2px;
  }

  .tool-icons {
    gap: 9px;
  }

  .tool-icons .hide-mobile {
    display: none;
  }

  .sidebar {
    width: 125px;
    flex-basis: 125px;
    padding: 25px 7px 12px;
    font-size: 11px;
  }

  .side-heading {
    margin-left: 8px;
  }

  .content {
    padding: 28px 10px 16px;
  }

  .folders {
    grid-template-columns: repeat(2, minmax(90px, 1fr));
    row-gap: 28px;
  }

  .folder-art {
    width: min(100%, 112px);
  }

  .folder-name {
    font-size: 12px;
  }

  .statusbar {
    padding: 0 9px;
    font-size: 9px;
  }

  .status-right {
    gap: 6px;
  }

  .slider {
    width: 36px;
  }
}

@media (max-width: 390px) {
  .sidebar {
    width: 105px;
    flex-basis: 105px;
  }

  .location-title {
    font-size: 12px;
  }

  .nav-buttons {
    gap: 7px;
  }

  .toolbar {
    gap: 7px;
  }
}

/* LOADING TITIK iOS */
.ios-typing-bubble {
  background-color: #e9e9eb;
  padding: 6px 9px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.ios-typing-bubble .dot {
  width: 3px;
  height: 3px;
  background-color: #8e8e93;
  border-radius: 50%;
  animation: iosPulse 1.4s infinite ease-in-out both;
}
.ios-typing-bubble .dot:nth-child(1) { animation-delay: -0.32s; }
.ios-typing-bubble .dot:nth-child(2) { animation-delay: -0.16s; }
.ios-typing-bubble .dot:nth-child(3) { animation-delay: 0s; }
@keyframes iosPulse {
  0%, 80%, 100% { transform: scale(0.85); opacity: 0.45; }
  40% { transform: scale(1.05); opacity: 1; }
}
.folder-view.loading-view { min-height: 100%; }

</style>
</head>

<script>

/* ANTI-ZOOM: blokir pinch dua jari, double-tap zoom, dan zoom dengan Ctrl/Command. */
(function () {
  // iOS Safari gesture events
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (eventName) {
    document.addEventListener(eventName, function (event) {
      event.preventDefault();
    }, { passive: false });
  });

  // Pinch zoom pada browser berbasis touch
  document.addEventListener("touchmove", function (event) {
    if (event.touches && event.touches.length > 1) {
      event.preventDefault();
    }
  }, { passive: false });

  // Cegah double-tap zoom tanpa mengganggu klik/tap biasa
  var lastTouchEnd = 0;
  document.addEventListener("touchend", function (event) {
    var now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

  // Cegah zoom dengan Ctrl + roda mouse / trackpad
  document.addEventListener("wheel", function (event) {
    if (event.ctrlKey || event.metaKey) {
      event.preventDefault();
    }
  }, { passive: false });

  // Cegah shortcut zoom browser: Ctrl/Command +, -, atau 0
  document.addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) &&
        (event.key === "+" || event.key === "-" || event.key === "=" ||
         event.key === "0" || event.key === "_")) {
      event.preventDefault();
    }
  }, { passive: false });
})();

const content = document.getElementById("content");
const title = document.getElementById("locationTitle");
const crumb = document.getElementById("crumbName");
const count = document.getElementById("itemCount");
const back = document.getElementById("back");
const forward = document.getElementById("forward");
const folders = document.getElementById("folders");

let historyStack = ["Desktop"];
let historyIndex = 0;

/* ISI FOLDER */

      <div class="ios-typing-bubble" aria-label="Loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

  "Documents": `

    </div>

  "Desktop": `

/* NAVIGASI FOLDER */
function render(name, push = true) {

  if (push) {
    historyStack = historyStack.slice(0, historyIndex + 1);
    historyStack.push(name);
    historyIndex = historyStack.length - 1;
  }

  title.textContent = name;
  crumb.textContent = name;

  document.querySelectorAll(".sidebar-link").forEach(item => {
    item.classList.toggle("active", item.dataset.location === name);
  });

  back.disabled = historyIndex <= 0;
  forward.disabled = historyIndex >= historyStack.length - 1;

  if (name === "Desktop") {
    content.innerHTML = "";
    content.appendChild(folders);
    count.textContent = "6 items";
  } else {
    content.innerHTML = folderContent[name] || "";
    count.textContent = "1 item";
  }
}

/* KLIK FOLDER */
folders.addEventListener("click", event => {
  const folder = event.target.closest("[data-folder]");

  if (folder) {
    render(folder.dataset.folder);
  }
});

/* NAVIGASI SIDEBAR */
document.querySelectorAll(".sidebar-link").forEach(item => {
  item.addEventListener("click", () => render(item.dataset.location));
});

/* TOMBOL BACK */
back.addEventListener("click", () => {
  if (historyIndex > 0) {
    historyIndex--;
    render(historyStack[historyIndex], false);
  }
});

/* TOMBOL FORWARD */
forward.addEventListener("click", () => {
  if (historyIndex < historyStack.length - 1) {
    historyIndex++;
    render(historyStack[historyIndex], false);
  }
});
</script>

</body>
</html>
